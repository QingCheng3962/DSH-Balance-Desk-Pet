<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: http://127.0.0.1:*; img-src 'self' data: blob: http: https:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data: http: https:; connect-src 'self' http://127.0.0.1:*;">
<title>DSH 小鲸鱼桌面挂件</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  }
  /* 伪造 DSH 主聊天界面的输入区标记：挂件只有检测到它才会初始化 */
  .dshw-fake-composer {
    position: fixed;
    left: -9999px;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="root"><div class="dshw-fake-composer" data-composer-input="true" role="textbox" aria-multiline="true" contenteditable="false" aria-hidden="true"></div></div>

<script>
  // —— 桌面点击穿透：指针落在挂件可交互元素上时接管鼠标，落空则穿透到桌面 ——
  (function () {
    var api = window.dshwDesktop
    if (!api || typeof api.setClickThrough !== 'function') return

    var last = null

    function isInteractive(x, y) {
      var el = null
      try { el = document.elementFromPoint(x, y) } catch (err) { return false }
      if (!el) return false
      if (el === document.body || el === document.documentElement) return false
      var cs = null
      try { cs = window.getComputedStyle(el) } catch (err) { return false }
      if (!cs) return false
      if (cs.pointerEvents === 'none') return false
      if (cs.display === 'none' || cs.visibility === 'hidden') return false
      if (cs.opacity === '0') return false
      return true
    }

    function update(x, y) {
      var inter = isInteractive(x, y)
      if (inter !== last) {
        last = inter
        api.setClickThrough(!inter)
      }
    }

    window.addEventListener('mousemove', function (e) { update(e.clientX, e.clientY) }, true)
    window.addEventListener('mouseleave', function () {
      if (last !== false) { last = false; api.setClickThrough(true) }
    }, true)
    window.addEventListener('blur', function () {
      if (last !== false) { last = false; api.setClickThrough(true) }
    }, true)

    api.setClickThrough(true)
  })()
</script>

<script defer src="/dsh-whale/widget.js"></script>
</body>
</html>
